[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restforge"
version = "0.1.0"
description = "Declarative, secure REST API builder for SQL databases, files, upstream APIs and Python callables"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pyjwt>=2.8",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5"]
oracle = ["oracledb>=2.0"]
keyring = ["keyring>=25"]   # Windows Credential Manager / macOS Keychain
dev = ["pytest>=8"]

[project.scripts]
restforge = "restforge.cli:app"

[tool.setuptools.packages.find]
include = ["restforge*"]

[tool.setuptools.package-data]
restforge = ["static/swagger/*"]
